name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set LIBCLANG_PATH
        shell: pwsh
        run: |
          $p = 'C:\Program Files\LLVM\bin'
          if (Test-Path $p) { "LIBCLANG_PATH=$p" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }

      - name: Resolve version and verify tag
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $cargoVer = $m.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            if ($tag.TrimStart('v') -ne $cargoVer) {
              Write-Error "Tag $tag does not match Cargo.toml version $cargoVer"
              exit 1
            }
          } else {
            $tag = "v$cargoVer-dev"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: cargo test
        run: cargo test --no-default-features
      - name: cargo build --release
        run: cargo build --release --no-default-features

      - name: Smoke test (--self-check)
        shell: pwsh
        run: |
          # release 版為 windows 子系統：PowerShell 不會等待 GUI 程式，須用 Start-Process -Wait 取得結束碼
          $p = Start-Process -FilePath target/release/whisper-typeless.exe -ArgumentList '--self-check' -Wait -PassThru -NoNewWindow
          Write-Host "self-check exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $tag = '${{ steps.ver.outputs.tag }}'
          $name = "whisper-typeless-$tag-windows-x86_64-cpu"
          $stage = Join-Path $PWD "dist/$name"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/release/whisper-typeless.exe $stage
          foreach ($f in 'model-catalog.json','MODEL_CATALOG.md','README.md','LICENSE','CHANGELOG.md') {
            if (Test-Path $f) { Copy-Item $f $stage }
          }
          if (Test-Path templates) { Copy-Item templates (Join-Path $stage 'templates') -Recurse }
          $zip = Join-Path $PWD "dist/$name.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -FilePath dist/SHA256SUMS.txt -Encoding ascii
          "zip=dist/$name.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whisper-typeless-windows-cpu
          path: |
            ${{ steps.pkg.outputs.zip }}
            dist/SHA256SUMS.txt
          retention-days: 14

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          gh release create "$tag" "${{ steps.pkg.outputs.zip }}" dist/SHA256SUMS.txt --generate-notes --verify-tag --title "whisper-typeless $tag"
