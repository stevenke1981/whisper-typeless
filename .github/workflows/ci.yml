name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt / clippy / test / build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # 快取需綁定 runner 映像版本：whisper-rs-sys 的 CMake 快取記錄 MSVC 絕對路徑，映像更新後會失效
          key: img-${{ env.ImageVersion }}
      - name: Set LIBCLANG_PATH
        shell: pwsh
        run: |
          $p = 'C:\Program Files\LLVM\bin'
          if (Test-Path $p) { "LIBCLANG_PATH=$p" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: cargo test
        run: cargo test --no-default-features
      - name: cargo build --release
        run: cargo build --release --no-default-features
