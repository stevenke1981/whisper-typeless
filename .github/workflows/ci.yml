name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt / clippy / test / build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # 快取需綁定 runner 映像版本：whisper-rs-sys 的 CMake 快取記錄 MSVC 絕對路徑，映像更新後會失效
          key: img-${{ env.ImageVersion }}
      - name: Set LIBCLANG_PATH
        shell: pwsh
        run: |
          $p = 'C:\Program Files\LLVM\bin'
          if (Test-Path $p) { "LIBCLANG_PATH=$p" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: cargo test
        run: cargo test --no-default-features
      - name: cargo build --release
        run: cargo build --release --no-default-features

  vulkan:
    name: vulkan check / clippy / build
    runs-on: windows-latest
    env:
      # whisper.cpp 的 vulkan-shaders-gen 巢狀 CMake 路徑會超過 250 字元上限，target 需放在短路徑
      CARGO_TARGET_DIR: C:\t
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: img-${{ env.ImageVersion }}-vulkan
          # 目標資料夾改到 C:\t（見下方），不快取 target，只快取 registry
          cache-targets: false
      - name: Set LIBCLANG_PATH
        shell: pwsh
        run: |
          $p = 'C:\Program Files\LLVM\bin'
          if (Test-Path $p) { "LIBCLANG_PATH=$p" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
      # ggml-vulkan 需要 Vulkan SDK（含 glslc）；此 action 會設定 VULKAN_SDK 與 PATH
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: false
          cache: true
          stripdown: true
      # whisper.cpp 的 vulkan-shaders-gen 巢狀路徑在 MSBuild 下會超過 MAX_PATH（本機實測），改用 Ninja + MSVC 環境
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Use Ninja for CMake
        shell: pwsh
        run: '"CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'
      - name: Verify Vulkan SDK
        shell: pwsh
        run: |
          Write-Host "VULKAN_SDK = $env:VULKAN_SDK"
          if (-not $env:VULKAN_SDK -or -not (Test-Path "$env:VULKAN_SDK\Bin\glslc.exe")) { Write-Error 'glslc.exe not found in VULKAN_SDK'; exit 1 }
      - name: cargo check
        run: cargo check --all-targets --features vulkan
      - name: cargo clippy
        run: cargo clippy --all-targets --features vulkan -- -D warnings
      - name: cargo build --release
        run: cargo build --release --features vulkan
